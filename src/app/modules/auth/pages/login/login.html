<form class="px-2 py-4">
  <div class="login-title">
    <h1>Bienvenido</h1>
    <span>Por favor, ingresa tus datos</span>
  </div>

  <div class="login-form">
    <mat-form-field class="w-100 mb-3">
      <mat-label>Correo electrónico</mat-label>
      <input matInput type="email" placeholder="ejemplo@dominio.com" required>
    </mat-form-field>
    <mat-form-field class="w-100 mb-3">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" placeholder="••••••••" required>
    </mat-form-field>
    <div class="options login-form-text d-flex justify-content-between align-items-center">
      <mat-checkbox>Recuerdame</mat-checkbox>
      <span class=" underline-option">¿Olvidaste la contraseña?</span>
    </div>
    <button matButton="filled" class="w-100 mb-4 py-4">Entrar</button>
    <p class="login-form-text text-center">¿Aún no tienes una cuenta? <span class="underline-option"
        (click)="changeForm()">Registrate</span></p>

  </div>




</form>
