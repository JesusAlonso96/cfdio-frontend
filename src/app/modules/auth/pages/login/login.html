<mat-card class="login-card px-2 py-3">
  <div class="w-100 logo-container d-flex justify-content-center">
    <img width="50%" height="25%" src="./assets/transparent-logo.png" alt="cfdio-logo">
  </div>

  <mat-card-header class="d-flex justify-content-center pb-4">
    <mat-card-title>
      Iniciar sesión
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form class="p-1">
      <mat-form-field class="w-100">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" placeholder="ejemplo@dominio.com" required>
      </mat-form-field>
      <mat-form-field class="w-100">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" placeholder="••••••••" required>
      </mat-form-field>
      <button matButton="filled" class="w-100 mb-3 py-4">Entrar</button>
    </form>
  </mat-card-content>
  <mat-card-actions class="justify-content-center card-footer">
    <p>¿Aún no tienes una cuenta? <span (click)="changeForm()">Registrate</span></p>
  </mat-card-actions>
</mat-card>
