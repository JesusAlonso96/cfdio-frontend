<div class="d-flex overflow-hidden h-100">


    <div class="w-50 bg-white form-section">

        <div class="d-flex justify-content-center align-items-center">

            <div class="auth-wrapper">
                <img  class="ms-1 mb-3" src="./assets/logos/logo4.svg" alt="">
                
                
                @if (!showRegister()) {
                <app-login (clicked)="toggleRegistrationForm()"></app-login>
                } @else {
                <app-register (clicked)="toggleRegistrationForm()"></app-register>
                }
            </div>
        </div>



    </div>
    <div class="w-50 bg-auth">



        <img class="data-logo" src="./assets/bg-auth.svg" alt="">
    </div>

</div>
