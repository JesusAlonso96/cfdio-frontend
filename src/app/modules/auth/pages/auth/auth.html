<div class="container-fluid h-100">

    <div class="row h-100">
        <div class="col-lg-6 col-md-12 h-100 bg-white form-section">
            <img src="./assets/transparent-logo.png" alt="">

            <div class="d-flex justify-content-center align-items-center">
                <div class="auth-wrapper ">

                    @if (!showRegister()) {
                    <app-login (clicked)="toggleRegistrationForm()"></app-login>
                    } @else {
                    <app-register (clicked)="toggleRegistrationForm()"></app-register>
                    }
                </div>
            </div>



        </div>
        <div class="col-lg-6 col-md-6 bg-auth">
            <img class="shapes" src="./assets/FONDO1.png" alt="">


            <img class="data-logo" src="./assets/undraw_data-input_whqw.svg" alt="">
        </div>
    </div>
</div>
