<div class="d-flex overflow-hidden h-100">
    <img class="main-logo m-4" src="./assets/logos/main-logo.svg" alt="">
    <div class="w-50 bg-white form-section">
        <div class="form-wrapper d-flex justify-content-center align-items-center">
            <div class="auth-wrapper">
                @if (!showRegister()) {
                <app-login class="form-panel show-animation" (clicked)="toggleRegistrationForm()"></app-login>
                } @else {
                <app-register class="form-panel show-animation" (clicked)="toggleRegistrationForm()"></app-register>
                }
            </div>
        </div>
    </div>
    <div class="w-50 bg-auth">
        <img class="data-logo" src="./assets/images/auth-image.svg" alt="">
    </div>
</div>
