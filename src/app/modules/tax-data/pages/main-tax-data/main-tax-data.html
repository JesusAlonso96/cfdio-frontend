<div class="container-fluid show-animation">
    <div class="row">
        <div class="col-12">
            <mat-card class="mx-4">
                <div class="card-data-header w-100 d-flex justify-content-between">
                    <mat-form-field class="tables-input w-75 me-3">
                        <input matInput type="text" placeholder="Buscar">
                        <mat-icon role="button" outlined matPrefix>search</mat-icon>
                    </mat-form-field>
                    <div>

                        <button (click)="openCreateTaxData()" style="padding-top: 1.4rem; padding-bottom: 1.45rem; border-radius: 6px;"
                            matButton="filled">
                            <mat-icon style="width: 24px; height: 24px; font-size: 24px;" outlined>post_add</mat-icon>
                            Nuevo</button>
                    </div>
                </div>
                <mat-card-content>
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                        <!-- Position Column -->
                        <ng-container matColumnDef="position">
                            <th mat-header-cell *matHeaderCellDef> No. </th>
                            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef> Name </th>
                            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                        </ng-container>

                        <!-- Weight Column -->
                        <ng-container matColumnDef="weight">
                            <th mat-header-cell *matHeaderCellDef> Weight </th>
                            <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
                        </ng-container>

                        <!-- Symbol Column -->
                        <ng-container matColumnDef="symbol">
                            <th mat-header-cell *matHeaderCellDef> Symbol </th>
                            <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
                        aria-label="Select page of users"></mat-paginator>

                </mat-card-content>
                <mat-card-actions>
                    <!-- <button matButton>LIKE</button>
                    <button matButton>SHARE</button> -->

                </mat-card-actions>
            </mat-card>
        </div>
    </div>

</div>
