<div class="container-fluid show-animation">
  <div class="row">
    <div class="col-12">
      <mat-card class="mx-4">
        <div class="card-data-header w-100 d-flex justify-content-between">
          <mat-form-field class="tables-input w-75 me-3">
            <input matInput type="text" placeholder="Buscar" />
            <mat-icon outlined matPrefix>search</mat-icon>
          </mat-form-field>
          <div>
            <button
              (click)="openCreateTaxData()"
              style="padding-top: 1.4rem; padding-bottom: 1.45rem; border-radius: 6px"
              matButton="filled"
            >
              <mat-icon style="width: 24px; height: 24px; font-size: 24px" outlined
                >post_add</mat-icon
              >
              Nuevo
            </button>
          </div>
        </div>
        <mat-card-content>
          <table mat-table [dataSource]="taxData" class="mat-elevation-z8">
            <!-- Position Column -->
            <ng-container matColumnDef="taxData">
              <th mat-header-cell *matHeaderCellDef>Datos fiscales</th>
              <td mat-cell *matCellDef="let element">
                <p class="my-2">
                  <span class="alias d-block">{{ element.alias }}</span>
                  <span class="details"
                    >{{ element.rfc }} - {{ element.legalName }}</span
                  >
                </p>
              </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="personType">
              <th mat-header-cell *matHeaderCellDef>Tipo</th>
              <td mat-cell class="details" style="width: 120px" *matCellDef="let element">
                {{ element.personType | personTypeLabel }}
              </td>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let element">
                <button
                  matIconButton
                  [matMenuTriggerFor]="menu"
                  aria-label="tax data options"
                >
                  <mat-icon outlined>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item>
                    <mat-icon outlined>edit_square</mat-icon>
                    <span>Editar</span>
                  </button>
                  <button mat-menu-item>
                    <mat-icon outlined>contract_delete</mat-icon>
                    <span>Eliminar</span>
                  </button>
                  <button mat-menu-item>
                    <mat-icon outlined>kid_star</mat-icon>
                    <span>Hacer predeterminado</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
          <mat-paginator
            [pageSizeOptions]="[5, 10, 25, 100]"
            aria-label="Select page of users"
          ></mat-paginator>
        </mat-card-content>
        <mat-card-actions> </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
