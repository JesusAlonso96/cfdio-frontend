<mat-toolbar [class.scrolled]="hasScrolled()" style="position: sticky; top: 0;"
    class="main-toolbar d-flex justify-content-between align-items-center">
    <h1 class="ms-3">{{currentModule}}</h1>

    <div>
        <button matIconButton>
            <mat-icon outlined>notifications</mat-icon>
        </button>
        <button [matMenuTriggerFor]="menu" matIconButton>
            <mat-icon outlined>account_circle</mat-icon>
        </button>


        <mat-menu #menu="matMenu">
            <button mat-menu-item>
                <span>Mi perfil</span>

                <mat-icon outlined>location_away</mat-icon>
            </button>
            <button mat-menu-item>
                <mat-icon outlined>settings</mat-icon>
                <span>Configuración</span>
            </button>
            <button (click)="logout()" mat-menu-item>
                <mat-icon outlined>exit_to_app</mat-icon>
                <span>Cerrar sesión</span>
            </button>
        </mat-menu>


    </div>
</mat-toolbar>
